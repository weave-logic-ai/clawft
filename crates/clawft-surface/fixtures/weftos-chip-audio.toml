# Tray-chip detail surface for the Audio chip.
# Binds to the WEFT-438 dual-emit set:
#   canonical: substrate/host-local/sensor/mic/summary
#   legacy flat (shim until 0.9.0): substrate/sensor/mic
# MicrophoneAdapter dual-writes both during the migration window, so
# existing legacy bindings keep working. Prefer the host-local summary
# path for new surfaces. Characterization::Rate — scalar RMS + peak
# levels per 500ms window, no spectral bins yet.

[[surfaces]]
id     = "weftos-chip/audio"
modes  = ["desktop"]
inputs = ["pointer"]
title  = "Audio"
# Prefer canonical; legacy still dual-emitted (WEFT-438).
subscriptions = ["substrate/host-local/sensor/mic/summary"]

[surfaces.root]
type  = "ui://stack"
id    = "/root"
attrs = { axis = "vertical" }

  [[surfaces.root.children]]
  type     = "ui://chip"
  id       = "/root/available"
  bindings = { label = "$substrate/host-local/sensor/mic/summary.available" }

  # RMS dBFS: silence floor clamped to -120, ceiling 0. Upper half of
  # the gauge is the "signal is present" region; the top 10 dB is hot.
  [[surfaces.root.children]]
  type     = "ui://gauge"
  id       = "/root/rms-db"
  attrs    = { min = -120.0, max = 0.0 }
  bindings = { value = "$substrate/host-local/sensor/mic/summary.rms_db", label = '"RMS (dBFS)"' }

  # Peak dBFS: same range as RMS; 0 dBFS is clipping. The gauge shape
  # makes "approaching clip" visible at a glance.
  [[surfaces.root.children]]
  type     = "ui://gauge"
  id       = "/root/peak-db"
  attrs    = { min = -120.0, max = 0.0 }
  bindings = { value = "$substrate/host-local/sensor/mic/summary.peak_db", label = '"Peak (dBFS)"' }

  [[surfaces.root.children]]
  type     = "ui://chip"
  id       = "/root/sample-rate"
  bindings = { label = "$substrate/host-local/sensor/mic/summary.sample_rate" }

  [[surfaces.root.children]]
  type     = "ui://chip"
  id       = "/root/samples-in-window"
  bindings = { label = "$substrate/host-local/sensor/mic/summary.samples_in_window" }

  [[surfaces.root.children]]
  type     = "ui://chip"
  id       = "/root/characterization"
  bindings = { label = "$substrate/host-local/sensor/mic/summary.characterization" }
