[package]
name = "clawft-cow-memory"
version.workspace = true
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Branchable, checkpointable memory over rvf-runtime::RvfStore (agenticow semantics, ported to Rust)."

[dependencies]
rvf-runtime = { workspace = true }
rvf-types = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# macOS-only: provides the `__errno_location` symbol rvf-runtime's
# `locking.rs` unconditionally references (a glibc/Linux name; macOS's libc
# exports `__error` instead). See `src/macos_errno_shim.rs`.
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
rand = { workspace = true }
