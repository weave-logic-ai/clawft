<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>clawft-wasm Web Worker Harness (WEFT-400)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 1rem;
      gap: 0.75rem;
    }

    h1 {
      font-size: 1.1rem;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    #status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #484f58;
    }
    #status-indicator.ready    { background: #3fb950; }
    #status-indicator.loading  { background: #d29922; }
    #status-indicator.error    { background: #f85149; }

    #status-text {
      font-size: 0.8rem;
      color: #8b949e;
    }

    .badge {
      font-size: 0.65rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #a371f7;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    a.switch {
      font-size: 0.75rem;
      color: #8b949e;
      margin-left: auto;
    }
    a.switch:hover { color: #58a6ff; }

    #config-panel {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    #config-panel label { font-size: 0.85rem; color: #8b949e; }
    #config-textarea {
      font-family: inherit;
      font-size: 0.8rem;
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.5rem;
      resize: vertical;
      min-height: 120px;
      max-height: 200px;
    }
    #config-textarea:focus { outline: none; border-color: #58a6ff; }

    #init-btn, #stream-toggle {
      align-self: flex-start;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.4rem 1rem;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #init-btn:hover { background: #2ea043; }
    #init-btn:disabled { background: #484f58; cursor: not-allowed; }

    #btn-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    #stream-toggle {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
    }
    #stream-toggle.active {
      background: #1f3a5f;
      border-color: #388bfd;
      color: #58a6ff;
    }

    #chat-display {
      flex: 1;
      overflow-y: auto;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .msg {
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
      line-height: 1.4;
      max-width: 85%;
      word-wrap: break-word;
    }
    .msg .ts {
      font-size: 0.65rem;
      color: #484f58;
      margin-bottom: 0.15rem;
    }
    .msg.user {
      align-self: flex-end;
      background: #1f3a5f;
      border: 1px solid #264a78;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #1a2332;
      border: 1px solid #30363d;
    }
    .msg.error {
      align-self: center;
      background: #3d1418;
      border: 1px solid #f8514966;
      color: #f85149;
    }
    .msg.system {
      align-self: center;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #8b949e;
      font-style: italic;
    }

    #input-bar {
      display: flex;
      gap: 0.5rem;
    }
    #msg-input {
      flex: 1;
      font-family: inherit;
      font-size: 0.85rem;
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.5rem;
    }
    #msg-input:focus { outline: none; border-color: #58a6ff; }
    #msg-input:disabled { background: #0d1117; color: #484f58; }

    #send-btn {
      background: #1f6feb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.4rem 1.2rem;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #send-btn:hover { background: #388bfd; }
    #send-btn:disabled { background: #484f58; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>
      clawft-wasm
      <span class="badge">web worker</span>
      <span id="status-indicator"></span>
      <span id="status-text">starting worker…</span>
      <a class="switch" href="./index.html">main-thread harness →</a>
    </h1>
  </header>

  <section id="config-panel">
    <label for="config-textarea">Provider Configuration (JSON)</label>
    <textarea id="config-textarea">{
  "providers": {
    "openrouter": {
      "apiKey": "YOUR_OPENROUTER_KEY"
    },
    "anthropic": {
      "apiKey": "YOUR_ANTHROPIC_KEY",
      "browserDirect": true
    }
  },
  "agents": {
    "defaults": {
      "model": "openrouter/meta-llama/llama-3.1-8b-instruct:free",
      "maxTokens": 4096
    }
  }
}</textarea>
    <div id="btn-row">
      <button id="init-btn">Initialize (worker)</button>
      <button id="stream-toggle" type="button" title="Use stream_chat via CHUNK events">stream: off</button>
    </div>
  </section>

  <section id="chat-display"></section>

  <section id="input-bar">
    <input id="msg-input" type="text" placeholder="Type a message (runs off main thread)…" disabled />
    <button id="send-btn" disabled>Send</button>
  </section>

  <script type="module" src="./main-worker.js"></script>
</body>
</html>
