# WEFT-228: ACL permissions for native cpal mic bridge + shell_info.

[[permission]]
identifier = "allow-shell-info"
description = "Allow the shell_info diagnostics command"
commands.allow = ["shell_info"]

[[permission]]
identifier = "allow-mic-backend-info"
description = "Allow mic backend diagnostics"
commands.allow = ["mic_backend_info"]

[[permission]]
identifier = "allow-mic-list-devices"
description = "Allow listing native input devices"
commands.allow = ["mic_list_devices"]

[[permission]]
identifier = "allow-mic-start"
description = "Allow starting native cpal capture"
commands.allow = ["mic_start"]

[[permission]]
identifier = "allow-mic-stop"
description = "Allow stopping native cpal capture"
commands.allow = ["mic_stop"]

[[permission]]
identifier = "allow-mic-poll"
description = "Allow polling buffered mic PCM"
commands.allow = ["mic_poll"]

[[permission]]
identifier = "allow-mic-test-level"
description = "Allow one-shot mic level probe"
commands.allow = ["mic_test_level"]

[[permission]]
identifier = "allow-mic-all"
description = "Allow all native mic bridge commands (WEFT-228)"
commands.allow = [
  "shell_info",
  "mic_backend_info",
  "mic_list_devices",
  "mic_start",
  "mic_stop",
  "mic_poll",
  "mic_test_level"
]
