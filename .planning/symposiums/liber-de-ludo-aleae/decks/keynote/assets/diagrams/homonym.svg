<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="t2 d2">
  <title id="t2">Circuitus is not a circuit-breaker</title>
  <desc id="d2">Two boxes: sample space versus stop-loss. Shared English word, different jobs.</desc>
  <rect width="720" height="260" fill="#08080A"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="36" y="56" width="300" height="160" rx="4" fill="#16161C" stroke="#C4A25C"/>
    <text x="186" y="88" text-anchor="middle" fill="#C4A25C" font-size="12" letter-spacing="0.1em">CIRCUITUS</text>
    <text x="186" y="118" text-anchor="middle" fill="#E0DEE8" font-size="14">What can happen?</text>
    <text x="186" y="146" text-anchor="middle" fill="#AAA8B4" font-size="12">sample space · ch. 14</text>
    <text x="186" y="172" text-anchor="middle" fill="#706E7A" font-size="12">missing on most WeftOS scores</text>
    <rect x="384" y="56" width="300" height="160" rx="4" fill="#16161C" stroke="#DC5F5F"/>
    <text x="534" y="88" text-anchor="middle" fill="#DC5F5F" font-size="12" letter-spacing="0.1em">CIRCUIT-BREAKER</text>
    <text x="534" y="118" text-anchor="middle" fill="#E0DEE8" font-size="14">When do we leave?</text>
    <text x="534" y="146" text-anchor="middle" fill="#AAA8B4" font-size="12">WEFT-322 · cost / no-ops</text>
    <text x="534" y="172" text-anchor="middle" fill="#706E7A" font-size="12">stake cap, not a sample space</text>
    <text x="360" y="28" text-anchor="middle" fill="#706E7A" font-size="11">FALSE FRIEND · keep both words</text>
  </g>
</svg>
