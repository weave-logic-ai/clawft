<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="t d">
  <title id="t">Circuitus — count the whole circuit, then lay the wager</title>
  <desc id="d">Flow: enumerate the circuit, count favorable faces, form odds r to s, lay a fair wager so expected value is zero.</desc>
  <rect width="720" height="280" fill="#08080A"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#E0DEE8">
    <rect x="24" y="88" width="140" height="72" rx="4" fill="#16161C" stroke="#C4A25C" stroke-width="1"/>
    <text x="94" y="120" text-anchor="middle">CIRCUITUS</text>
    <text x="94" y="140" text-anchor="middle" fill="#AAA8B4" font-size="11">all faces</text>
    <rect x="204" y="88" width="140" height="72" rx="4" fill="#16161C" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="274" y="120" text-anchor="middle">FAVORABLE</text>
    <text x="274" y="140" text-anchor="middle" fill="#AAA8B4" font-size="11">r ways</text>
    <rect x="384" y="88" width="140" height="72" rx="4" fill="#16161C" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="454" y="120" text-anchor="middle">ODDS r : s</text>
    <text x="454" y="140" text-anchor="middle" fill="#AAA8B4" font-size="11">s = rest</text>
    <rect x="564" y="88" width="132" height="72" rx="4" fill="#16161C" stroke="#6EC896" stroke-width="1"/>
    <text x="630" y="120" text-anchor="middle" fill="#6EC896">FAIR WAGER</text>
    <text x="630" y="140" text-anchor="middle" fill="#AAA8B4" font-size="11">EV = 0</text>
    <path d="M164 124 H204" stroke="#C4A25C" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M344 124 H384" stroke="#C4A25C" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M524 124 H564" stroke="#C4A25C" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="360" y="36" text-anchor="middle" fill="#C4A25C" font-size="12" letter-spacing="0.12em">CH. 14 · THE GENERAL RULE</text>
    <text x="360" y="232" text-anchor="middle" fill="#706E7A" font-size="12">Compare favorable to the rest of the circuit. Contend on equal terms.</text>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C4A25C"/>
    </marker>
  </defs>
</svg>
