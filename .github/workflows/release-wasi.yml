# Build clawft-wasm for wasm32-wasip2 and attach to GitHub Releases.
#
# cargo-dist v0.31.0 does not support wasip2 in its target matrix (HP-16),
# so this workflow runs independently alongside release.yml.
#
# WEFT-405 supply-chain parity (shared with wasm-browser.yml):
#   - VERSION.json (tag, git sha, workspace version, target)
#   - SHA256SUMS + per-file .sha256 detached checksums
#   - GitHub Attestations / sigstore provenance (actions/attest-build-provenance)
# Packaging helper: scripts/release/package-wasm-artifact.sh

name: Release WASI

permissions:
  contents: write
  id-token: write
  attestations: write

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

env:
  CARGO_TERM_COLOR: always
  TARGET: wasm32-wasip2
  PROFILE: release

jobs:
  build-wasi:
    name: Build & upload WASI binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasip2 target
        run: rustup target add wasm32-wasip2

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasi-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasi-release-

      - name: Install binaryen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binaryen bc

      - name: Build WASM binary
        run: |
          cargo build \
            --target ${{ env.TARGET }} \
            --profile ${{ env.PROFILE }} \
            -p clawft-wasm \
            --no-default-features

      - name: Verify and measure binary
        id: wasm
        run: |
          WASM="target/${{ env.TARGET }}/${{ env.PROFILE }}/clawft_wasm.wasm"
          if [ ! -f "$WASM" ]; then
            echo "::error::WASM binary not found at $WASM"
            exit 1
          fi

          SIZE_BYTES=$(wc -c < "$WASM")
          SIZE_KB=$(echo "scale=1; $SIZE_BYTES / 1024" | bc)
          GZIP_SIZE=$(gzip -9 -c "$WASM" | wc -c)
          GZIP_KB=$(echo "scale=1; $GZIP_SIZE / 1024" | bc)

          echo "wasm_path=$WASM" >> "$GITHUB_OUTPUT"
          echo "size_kb=$SIZE_KB" >> "$GITHUB_OUTPUT"
          echo "gzip_kb=$GZIP_KB" >> "$GITHUB_OUTPUT"
          echo "## WASI Binary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Raw | ${SIZE_KB} KB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gzipped | ${GZIP_KB} KB |" >> "$GITHUB_STEP_SUMMARY"

      - name: Package, version, and checksum
        id: package
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          OUT="dist-wasi"
          mkdir -p "$OUT"
          # shellcheck disable=SC1091
          eval "$(scripts/release/package-wasm-artifact.sh package-wasi \
            --wasm "${{ steps.wasm.outputs.wasm_path }}" \
            --tag "$TAG" \
            --out-dir "$OUT" \
            --git-sha "${GITHUB_SHA}")"
          {
            echo "asset=${asset}"
            echo "version_json=${version_json}"
            echo "sha256sums=${sha256sums}"
            echo "workspace_version=${workspace_version}"
          } >> "$GITHUB_OUTPUT"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Version" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$version_json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$sha256sums" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance (sigstore)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.version_json }}

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          OUT="dist-wasi"
          ASSET="${{ steps.package.outputs.asset }}"
          VER_JSON="${{ steps.package.outputs.version_json }}"

          # Wait for the release to exist (created by release.yml, takes ~15 min)
          for i in $(seq 1 90); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG found"
              break
            fi
            echo "Waiting for release $TAG to be created... ($i/90)"
            sleep 20
          done

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG not found after 30 minutes"
            exit 1
          fi

          # Upload binary + version manifest + detached checksums
          SUMS="${{ steps.package.outputs.sha256sums }}"
          gh release upload "$TAG" \
            "$ASSET" \
            "$VER_JSON" \
            "${ASSET}.sha256" \
            "${VER_JSON}.sha256" \
            "$SUMS" \
            --clobber
          echo "Uploaded WASI artefact + VERSION.json + SHA256SUMS to release $TAG"
